name: Native smoke build

on:
  pull_request:
    branches: [main, release/1.1.8-final-464, release/1.3.2-terre-466, release/craft-1.1.15c]
  push:
    branches: [main, release/1.1.8-final-464, release/1.3.2-terre-466, release/craft-1.1.15c]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'

      - name: Verify repository layout and browser regressions
        shell: pwsh
        run: |
          $tests = @(Get-ChildItem -Path 'tests/*.test.mjs' -File | Sort-Object FullName | ForEach-Object { $_.FullName })
          if ($tests.Count -eq 0) { throw 'No shared Node regression files found' }
          & node --test --test-concurrency=2 @tests
          if ($LASTEXITCODE -ne 0) { throw "Node regression checks failed" }
          pwsh -NoLogo -NoProfile -File .\tests\installer-product-routing.portable.ps1
          if ($LASTEXITCODE -ne 0) { throw "Installer product/channel checks failed" }
          pwsh -NoLogo -NoProfile -File .\tests\recent-install-record.portable.ps1
          if ($LASTEXITCODE -ne 0) { throw "Recent install record isolation checks failed" }
          node tests/update-check-and-atlas.mjs
          if ($LASTEXITCODE -ne 0) { throw "Update and atlas checks failed" }
          .\tests\build-inputs.test.ps1
          .\tests\manual-cuts.test.ps1

      - name: Verify injected controls inherit Terre host typography
        shell: pwsh
        run: |
          node tests/terre-ui-font-render.mjs --out .build/terre-ui-font
          if ($LASTEXITCODE -ne 0) { throw "Terre UI font inheritance checks failed" }

      - name: Prepare pinned upstream dependencies from a clean checkout
        shell: powershell
        run: .\prepare-build.ps1

      - name: Verify runtime reconstruction and offline preparation
        shell: pwsh
        run: |
          node tests/verify-webgal-runtime.mjs
          if ($LASTEXITCODE -ne 0) { throw "Runtime reconstruction regression checks failed" }
          node tests/figure-export-runtime.mjs
          if ($LASTEXITCODE -ne 0) { throw "Figure output clock/update parity checks failed" }
          node tests/cubism2-runtime-contract.mjs
          if ($LASTEXITCODE -ne 0) { throw "Cubism2 runtime motion contract checks failed" }
          .\prepare-build.ps1 -Offline
          node scripts/verify-build-inputs.mjs
          if ($LASTEXITCODE -ne 0) { throw "Prepared inputs failed verification" }

      - name: Compare multilingual font rendering with the upstream baseline
        shell: pwsh
        run: |
          . .\scripts\build-common.ps1
          Expand-CheckedBuildArchive .build/downloads/WebGAL-4.6.4-web.zip .build/font-baseline
          node tests/font-render.mjs --runtime package/runtime/web --baseline .build/font-baseline --out .build/font-render
          if ($LASTEXITCODE -ne 0) { throw "Font rendering comparison failed" }

      - name: Verify figure-only exclusion with pinned Pixi pixels
        shell: pwsh
        run: |
          node tests/figure-export-render.mjs package/runtime/web .build/font-baseline .build/figure-export
          if ($LASTEXITCODE -ne 0) { throw "Figure output pixel checks failed" }

      - name: Compile native exporter for early font smoke
        shell: powershell
        run: |
          .\build.ps1
          node scripts/build-timeline.mjs
          if ($LASTEXITCODE -ne 0) { throw "Timeline metadata preparation failed" }

      - name: Verify optional Live2D preflight against referenced assets
        shell: powershell
        run: .\tests\font-render-preflight.test.ps1

      - name: Render and decode a multilingual native export
        shell: pwsh
        run: |
          . .\scripts\build-common.ps1
          $lock = Get-Content build/dependencies.lock.json -Raw | ConvertFrom-Json
          $archive = Get-PinnedBuildInput $lock.ffmpegTest (Join-Path $PWD '.build/downloads')
          Expand-CheckedBuildArchive $archive (Join-Path $PWD '.build/ffmpeg-test')
          $env:PATH = (Join-Path $PWD ('.build/ffmpeg-test/ffmpeg-' + $lock.ffmpegTest.version + '-essentials_build/bin')) + ';' + $env:PATH
          .\tests\font-render-native.ps1

      - name: Restore locked optional AI dependencies
        shell: pwsh
        working-directory: ai-runtime
        run: |
          npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw "Locked AI dependency restore failed" }

      - name: Build the complete product and installer from current source
        shell: powershell
        run: |
          .\build-product.ps1
          # Keep the verified compressed build before the repeat-build check
          # replaces dist with a larger, uncompressed development payload.
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).productVersion
          New-Item -ItemType Directory -Path .build/ci-installer -Force | Out-Null
          Copy-Item -LiteralPath "dist/WebVideo+-Setup-$version.exe" -Destination .build/ci-installer
          # Repeat in the same host to catch locked outputs and stale staging.
          .\build-product.ps1 -Fast

      - name: Verify semantic worker segmentation and complete package
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Join-Path $PWD 'package/WebGAL.Video.exe') -ArgumentList @('segment-smoke') -Wait -PassThru -NoNewWindow
          if($p.ExitCode -ne 0){ throw "Semantic segment smoke failed with exit code $($p.ExitCode)" }
          node scripts/verify-package.mjs
          if ($LASTEXITCODE -ne 0) { throw "Full package verification failed" }
          $version = (Get-Content version.json -Raw | ConvertFrom-Json).productVersion
          if(-not(Test-Path -LiteralPath "dist/WebVideo+-Setup-$version.exe")){throw "Installer output is missing"}

      - name: Run production settings, persistence and process regressions against the complete build
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $PWD 'package'
          $evidence = Join-Path $PWD '.build/ci-native-tests'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $kernel = Join-Path $package 'WebGAL.Video.exe'
          if (-not (Test-Path -LiteralPath $kernel)) { throw 'Build the complete current-source package first' }
          $kernelHash = (Get-FileHash -LiteralPath $kernel -Algorithm SHA256).Hash.ToLowerInvariant()
          $checks = @()
          function Invoke-CiRegression([string]$Name, [string]$Script, [hashtable]$Parameters) {
            $record = [pscustomobject]@{ name=$Name; script=$Script; parameters=$Parameters; status='RUNNING'; kernel=$kernel; kernelSha256=$kernelHash }
            $script:checks += $record
            try {
              & $Script @Parameters 2>&1 | Tee-Object -FilePath (Join-Path $evidence ($Name + '.log'))
              if ($LASTEXITCODE -ne 0) { throw "$Name returned exit code $LASTEXITCODE" }
              $record.status = 'PASS'
            } catch { $record.status = 'FAIL'; throw }
            finally {
              ConvertTo-Json -InputObject $script:checks -Depth 8 | Set-Content -LiteralPath (Join-Path $evidence 'native-results.json') -Encoding utf8
              "- $Name`: $($record.status)" | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            }
          }
          Invoke-CiRegression 'cubism-memory-defaults' './tests/cubism-memory-defaults.test.ps1' @{ OutputRoot=(Join-Path $evidence 'memory-defaults') }
          Invoke-CiRegression 'lifecycle-settings' './tests/lifecycle-settings.test.ps1' @{ EvidenceDirectory=(Join-Path $evidence 'settings') }
          Invoke-CiRegression 'lifecycle-reliability' './tests/lifecycle-reliability.test.ps1' @{ EvidenceDirectory=(Join-Path $evidence 'lifecycle') }
          Invoke-CiRegression 'render-process-output' './tests/render-process-output.test.ps1' @{ RepositoryRoot=$PWD.Path; OutputRoot=(Join-Path $evidence 'process-output') }
          # Runtime fixture uses a local SDK substitute and a fixture key; it never calls a paid provider.
          Invoke-CiRegression 'runtime-persistence' './tests/runtime-persistence.test.ps1' @{ PackageRoot=$package; EvidenceRoot=(Join-Path $evidence 'persistence') }

      - name: Run native readiness and browser-death capture regressions in an isolated package
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $PWD 'package'
          $evidence = Join-Path $PWD '.build/ci-native-tests/graphics'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $state = [pscustomobject]@{ status='RUNNING'; reason=''; runtimeVersion=''; package=$package; engines=@(); captureFault='NOT_RUN'; readiness=@([pscustomobject]@{engine='webgal-464';format='png';status='NA';reason='Frozen 4.6.4 product does not expose PNG compatibility capture'}) }
          'PNG readiness: **NA** - frozen 4.6.4 product has no PNG compatibility capture feature; JPEG remains required.' | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          function Save-GraphicsState {
            $state | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $evidence 'graphics-results.json') -Encoding utf8
          }
          Add-Type -AssemblyName System.Windows.Forms
          $unavailable = @()
          if (-not [Environment]::UserInteractive) { $unavailable += 'runner has no interactive desktop' }
          if ([System.Windows.Forms.Screen]::AllScreens.Count -lt 1) { $unavailable += 'runner exposes no display' }
          # Make the already pinned native loader discoverable to the capability query.
          $env:PATH = $package + ';' + $env:PATH
          Add-Type -Path (Join-Path $package 'Microsoft.Web.WebView2.Core.dll')
          try { $state.runtimeVersion = [Microsoft.Web.WebView2.Core.CoreWebView2Environment]::GetAvailableBrowserVersionString($null) }
          catch {
            $failure = $_.Exception
            while ($failure.InnerException) { $failure = $failure.InnerException }
            if ($failure.GetType().FullName -eq 'Microsoft.Web.WebView2.Core.WebView2RuntimeNotFoundException') { $unavailable += 'WebView2 Runtime is unavailable' }
            else { throw }
          }
          if ($unavailable.Count) {
            $state.status = 'NA'; $state.reason = $unavailable -join '; '; Save-GraphicsState
            "Native readiness/capture fault: **NA** - $($state.reason). No graphical assertion was counted as passed." | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            throw "NA: graphical release gates require an available desktop and WebView2 Runtime: $($state.reason)"
          }
          $lock = Get-Content build/dependencies.lock.json -Raw | ConvertFrom-Json
          $media = Join-Path $PWD ('.build/ffmpeg-test/ffmpeg-' + $lock.ffmpegTest.version + '-essentials_build/bin')
          foreach ($tool in @('ffmpeg.exe','ffprobe.exe')) { if (-not (Test-Path -LiteralPath (Join-Path $media $tool))) { throw "Missing pinned media tool: $tool" } }
          $engines = @(@{name='webgal-464';root=(Join-Path $package 'runtime/web')})
          $state.engines = @($engines | ForEach-Object { $_.name })
          # Capture-fault compiles a harness into package/. Keep that write out of the verified distribution.
          $fixture = Join-Path $PWD ('.build/ci-native-fixtures/graphics-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $fixture -Force | Out-Null
          Copy-Item -LiteralPath $package -Destination (Join-Path $fixture 'package') -Recurse
          Save-GraphicsState
          try {
            & './tests/render-capture-fault-native.ps1' -RepositoryRoot $fixture -OutputRoot (Join-Path $evidence 'capture-fault') 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'capture-fault.log')
            if ($LASTEXITCODE -ne 0) { throw 'Native capture fault regression failed' }
            $state.captureFault = 'PASS'; Save-GraphicsState
            foreach ($engine in $engines) {
              foreach ($format in @('jpeg')) {
                $check = [pscustomobject]@{ engine=$engine.name; format=$format; status='RUNNING' }
                $state.readiness += $check; Save-GraphicsState
                & './tests/render-readiness-native.ps1' -EngineRoot $engine.root -PackageRoot (Join-Path $fixture 'package') -OutputRoot (Join-Path $evidence ($engine.name + '-' + $format)) -MediaToolDirectory $media -Engine webgal -CaptureFormat $format -ExpectedMemoryMiB 128 2>&1 | Tee-Object -FilePath (Join-Path $evidence ($engine.name + '-' + $format + '.log'))
                if ($LASTEXITCODE -ne 0) { throw "Native readiness regression failed: $($engine.name) $format" }
                $check.status = 'PASS'; Save-GraphicsState
              }
            }
            & node scripts/verify-package.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Original package integrity changed during isolated graphical regressions' }
            $state.status = 'PASS'
          } catch {
            $state.status = 'FAIL'; $state.reason = $_.Exception.Message
            if ($check -and $check.status -eq 'RUNNING') { $check.status = 'FAIL' }
            throw
          }
          finally {
            Save-GraphicsState
            "Native readiness/capture fault: **$($state.status)**; WebView2 $($state.runtimeVersion); readiness PASS=$(@($state.readiness | Where-Object status -eq 'PASS').Count), NA=$(@($state.readiness | Where-Object status -eq 'NA').Count)." | Out-File -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Preserve production regression evidence including failures and NA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-native-regression-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            .build/ci-native-tests/**/*.json
            .build/ci-native-tests/**/*.log
            .build/ci-native-tests/**/*.png
            .build/ci-native-tests/**/*.jpg

      - name: Record the validated installer source and checksums
        shell: pwsh
        run: |
          $versions = Get-Content version.json -Raw | ConvertFrom-Json
          $output = Join-Path $PWD '.build/ci-installer'
          $guide = @(
            "WebVideo+ $($versions.productVersion) Windows test installer"
            "Source commit: $env:GITHUB_SHA"
            "Source: https://github.com/$env:GITHUB_REPOSITORY/tree/$env:GITHUB_SHA"
            "Build: https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            "Installer version: $($versions.installerVersion); kernel: $($versions.kernelVersion)"
            'Built with the canonical build-product.ps1 on the Windows CI runner.'
            'This is the compressed installer preserved before the repeated fast-build check.'
            'The workflow checks pinned runtime inputs, production C# logic, frame scheduling, synthetic Pixi pixels, native export and package integrity.'
            'Unsigned test build. The installer wizard and the user original project have not been exercised.'
            'No private Live2D SDK or model research inputs are included.'
          )
          $guide | Set-Content -LiteralPath (Join-Path $output 'BUILD-AND-CHECKS.txt') -Encoding utf8
          Get-ChildItem -LiteralPath $output -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath (Join-Path $output 'SHA256SUMS.txt') -Encoding ascii

      - name: Preserve the validated Windows test installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: webvideo-windows-test-installer
          retention-days: 7
          if-no-files-found: error
          path: .build/ci-installer/*

      - name: Preserve synthetic font regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: font-render-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            .build/figure-export/*.json
            .build/figure-export/*.log
            .build/terre-ui-font/*.png
            .build/terre-ui-font/*.json
            .build/font-render/*.png
            .build/font-render/*.json
            .build/font-render/native/*/*.png
            .build/font-render/native/*/*.json
            .build/font-render/native/*/*.log
