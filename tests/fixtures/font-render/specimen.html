<!doctype html>

<header>WebVideo+ 字体 / Font rendering regression</header><div id="fontStatus">loading</div>
<section id="samples"></section><div id="extended"></div>
<div class="_TextBox_Container_p1zxt_10">
  <div class="_TextBox_main_p1zxt_18 _TextBox_main_miniavatarOff_p1zxt_39 _TextBox_Background_p1zxt_43"></div>
  <div id="textBoxMain" class="_TextBox_main_p1zxt_18 _TextBox_main_miniavatarOff_p1zxt_39">

<script>
(async () => {
  try {
    const samples = await (await fetch('/samples.json')).json();
    for (const id of ['zh', 'zhHant', 'ja', 'digits', 'latin', 'wrap', 'explicitBreak', 'rounded']) {
      const card = document.createElement('div'); card.className = 'card';
      const label = document.createElement('div'); label.className = 'label'; label.textContent = id;
      const sample = document.createElement('div'); sample.className = 'sample'; sample.id = id;
      sample.textContent = id === 'rounded' ? samples.zh : samples[id];
      if(id === 'ja') sample.lang = 'ja';
      if(id === 'zhHant') sample.lang = 'zh-Hant';
      card.append(label, sample); document.querySelector('#samples').append(card);
    }
    document.querySelector('#speaker').textContent = samples.speaker;
    document.querySelector('#extended').textContent = samples.extended;
    // Use the runtime's settled outline/gradient layers, including its real line height.
    for (const [index, line] of samples.dialogue.split('\n').entries()) {
      if(index) document.querySelector('#dialogue').append(document.createElement('br'));
      const glyph = document.createElement('span'); glyph.className = '_TextBox_textElement_Settled_p1zxt_97';
      for (const name of ['_outer_p1zxt_64', '_inner_p1zxt_78', '_zhanwei_p1zxt_89']) {
        const layer = document.createElement('span'); layer.className = name; layer.textContent = line; glyph.append(layer);
      }
      document.querySelector('#dialogue').append(glyph);
    }
    const fonts = await document.fonts.load('32px WebgalUI', Object.values(samples).join(''));
    const rounded = await document.fonts.load('32px "资源圆体"', samples.zh);
    await document.fonts.ready;
    if(!fonts.length || fonts.some(font => font.status !== 'loaded')) throw Error('WebgalUI did not load');
    if(!rounded.length || rounded.some(font => font.status !== 'loaded')) throw Error('Rounded control did not load');
    const box = element => { const r=element.getBoundingClientRect(); return {x:r.x,y:r.y,width:r.width,height:r.height}; };
    function lines(element) {
      const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT); const groups = new Map();
      while(walker.nextNode()) {
        const text=walker.currentNode;
        for(let i=0;i<text.length;i++) {
          if(text.data[i] === '\n') continue;
          const range=document.createRange(); range.setStart(text,i); range.setEnd(text,i+1);
          const r=range.getBoundingClientRect(); const key=Math.round(r.y*10)/10;
          const item=groups.get(key)||{y:key,text:'',left:r.left,right:r.right,height:r.height};
          item.text+=text.data[i];item.left=Math.min(item.left,r.left);item.right=Math.max(item.right,r.right);groups.set(key,item);
        }
      }
      return [...groups.values()].map(item=>({...item,width:item.right-item.left}));
    }
    const results={}; const ctx=document.createElement('canvas').getContext('2d');
    for(const id of ['zh','zhHant','ja','digits','latin','wrap','explicitBreak','rounded','extended']) {
      const element=document.getElementById(id), style=getComputedStyle(element);ctx.font=`${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
      results[id]={font:style.fontFamily,box:box(element),lineHeight:parseFloat(style.lineHeight),scrollWidth:element.scrollWidth,clientWidth:element.clientWidth,lines:lines(element),advance:ctx.measureText(element.textContent).width};
    }
    const dialogue=document.querySelector('#dialogue'), speaker=document.querySelector('#speaker');
    results.dialogue={font:getComputedStyle(dialogue).fontFamily,box:box(dialogue),scrollWidth:dialogue.scrollWidth,clientWidth:dialogue.clientWidth,scrollHeight:dialogue.scrollHeight,clientHeight:dialogue.clientHeight,layers:[...dialogue.querySelectorAll('._zhanwei_p1zxt_89')].map(box)};
    results.speaker={font:getComputedStyle(speaker).fontFamily,box:box(speaker)};
    document.querySelector('#fontStatus').textContent='WebgalUI loaded';
    globalThis.fontRenderResult={ok:true,viewport:{width:innerWidth,height:innerHeight},samples:results};
  } catch(error) { globalThis.fontRenderResult={ok:false,error:String(error.stack||error)}; }
})();
</script>
</html>
